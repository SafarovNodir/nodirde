<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rahmat | NodirDev</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{ --tt:.55s cubic-bezier(.4,0,.2,1); }
[data-theme="dark"]{ --bg:#060608; --surf:rgba(255,255,255,.028); --bdr:rgba(255,255,255,.07); --txt:#e8eaff; --txt2:rgba(200,205,240,.52); --acc:#a78bfa; --acc2:#60a5fa; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card{ max-width:680px; width:100%; background:var(--surf); border:1px solid var(--bdr); border-radius:24px; padding:40px 30px; text-align:center; }
h1{ font-family:'Syne',sans-serif; font-size:clamp(30px,5vw,48px); margin-bottom:12px; }
p{ color:var(--txt2); line-height:1.8; margin-bottom:24px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; padding:13px 26px; border-radius:50px; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; text-decoration:none; font-weight:700; }
</style>
</head>
<body>
  <div class="card">
    <h1>Rahmat!</h1>
    <p>So'rovingiz yuborildi. Tez orada bog'laniladi.</p>
    <a class="btn" href="/">Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
